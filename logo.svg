<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e2b"/>
      <stop offset="50%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#8a0008"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Skull Icon (Straw Hat Jolly Roger) -->
  <g transform="translate(15, 18)">
    <!-- Crossed Bones -->
    <path d="M12 18 L68 74 M68 18 L12 74" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <circle cx="12" cy="18" r="5" fill="#ffffff"/>
    <circle cx="68" cy="18" r="5" fill="#ffffff"/>
    <circle cx="12" cy="74" r="5" fill="#ffffff"/>
    <circle cx="68" cy="74" r="5" fill="#ffffff"/>

    <!-- Skull Face -->
    <ellipse cx="40" cy="46" rx="22" ry="20" fill="#ffffff"/>
    <path d="M30 58 L30 68 L50 68 L50 58 Z" fill="#ffffff"/>
    <!-- Teeth Lines -->
    <path d="M35 58 L35 68 M40 58 L40 68 M45 58 L45 68" stroke="#000000" stroke-width="2"/>
    <!-- Eyes -->
    <ellipse cx="32" cy="48" rx="5" ry="6" fill="#0b0c10"/>
    <ellipse cx="48" cy="48" rx="5" ry="6" fill="#0b0c10"/>
    <!-- Nose -->
    <polygon points="40,54 38,58 42,58" fill="#0b0c10"/>

    <!-- Straw Hat -->
    <path d="M14 40 Q40 28 66 40 Q40 34 14 40 Z" fill="#ffd700" stroke="#d4af37" stroke-width="1.5"/>
    <ellipse cx="40" cy="36" rx="16" ry="12" fill="#ffd700"/>
    <path d="M25 38 Q40 32 55 38" stroke="#e50914" stroke-width="3.5" fill="none"/>
  </g>

  <!-- Typography -->
  <text x="105" y="55" font-family="'Cinzel', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4">ONE PIECE</text>
  <text x="106" y="95" font-family="'Impact', 'Cinzel', sans-serif" font-size="44" font-weight="900" fill="url(#redGradient)" letter-spacing="8" filter="url(#glow)">FILM RED</text>
  <rect x="365" y="65" width="90" height="24" rx="4" fill="#ffd700" opacity="0.9"/>
  <text x="410" y="82" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#0b0c10" text-anchor="middle" letter-spacing="2">CINEMA</text>
</svg>
